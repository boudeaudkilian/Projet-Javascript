<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman RPG Combat</title>
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
    <div id="homeScreen" class="screen active">
        <div class="home-container">
            <div class="game-title">
                <h1>STICKMAN</h1>
                <h2>RPG COMBAT</h2>
                <div class="title-decoration"></div>
            </div>
            <div class="stickman-hero">
                <div class="stickman">
                    <div class="head"></div>
                    <div class="body"></div>
                    <div class="arms">
                        <div class="arm left"></div>
                        <div class="arm right"></div>
                    </div>
                    <div class="legs">
                        <div class="leg left"></div>
                        <div class="leg right"></div>
                    </div>
                </div>
            </div>
            <div class="menu-buttons">
                <button id="startBtn" class="btn btn-primary"><span>COMMENCER</span></button>
                <button id="instructionsBtn" class="btn btn-secondary"><span>CONTRÔLES</span></button>
            </div>
            <div class="footer-text">
                <p>Affrontez des ennemis • Débloquez des compétences • Devenez légendaire</p>
            </div>
        </div>
    </div>

    <div id="mainMenu" class="screen">
        <div class="menu-container">
            <h1>MENU PRINCIPAL</h1>
            <div class="menu-options">
                <button id="resumeBtn"   class="btn btn-primary">Reprendre</button>
                <button id="campaignBtn" class="btn btn-primary">Campagne</button>
                <button id="newGameBtn"  class="btn btn-primary">Nouvelle Partie</button>
                <button id="skillsBtn"   class="btn btn-secondary">Compétences</button>
                <button id="backToHomeBtn" class="btn btn-secondary">Accueil</button>
            </div>
        </div>
    </div>

    <div id="instructionsScreen" class="screen">
        <div class="instructions-container">
            <h1>CONTRÔLES</h1>
            <div class="instructions-content">
                <div class="instruction-item">
                    <h3>Déplacement</h3>
                    <p>Flèches ← → ou Q / D</p>
                </div>
                <div class="instruction-item">
                    <h3>Attaque corps à corps</h3>
                    <p>A ou Espace</p>
                </div>
                <div class="instruction-item">
                    <h3>Projectile</h3>
                    <p>E</p>
                </div>
                <div class="instruction-item">
                    <h3>Défense</h3>
                    <p>S (maintenir)</p>
                </div>
            </div>
            <button id="backFromInstructionsBtn" class="btn btn-secondary">Retour</button>
        </div>
    </div>

    <div id="levelsScreen" class="screen">
        <div class="levels-container">
            <h1>CHOISIR UN NIVEAU</h1>
            <div id="levels-grid" class="levels-grid"></div>
            <button id="backFromLevelsBtn" class="btn btn-secondary">Retour</button>
        </div>
    </div>

    <script type="module" src="./scripts/main.js"></script>
</body>
</html>
